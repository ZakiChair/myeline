name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Porte (d) du lot 0 : le même organisme doit donner un état identique au bit
  # près sous V8 (Node) et JSC (Bun, moteur de Safari). Voir
  # tools/porte-portabilite.mjs et docs/superpowers/notes/2026-07-30-vie-calibration.md.
  portabilite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: node tools/porte-portabilite.mjs
